<!DOCTYPE html>

<html>
    <head>
		<meta charset="utf-8">
		<style>
			body {
                margin: 0px;
				padding: 0px;
				overflow: hidden;
				height: 100%;
				background-color: black;
				font-family: 'Open Sans Condensed', sans-serif;
			}

			@font-face {
				font-family: "NES";
				src: url("assets/fonts/nintendo-nes-font.ttf") format("truetype");
				font-display: block;
			}

			/* HTML layer over the canvas. --px is one game pixel. */
			#overlay {
				position: fixed;
				pointer-events: none;
				overflow: hidden;
				--px: 1px;
			}

			/* Cutscenes play at the screen's resolution, in the same
			   320x240 box the game used to draw them in. */
			#overlay .cutscene {
				position: absolute;
				top: 0;
				left: 50%;
				height: 100%;
				width: calc(var(--px) * 320);
				transform: translateX(-50%);
				object-fit: fill;
				background: black;
			}

			/* Hints are pixel art: --hp is a whole number of screen pixels per
			   game pixel, so every edge lands on a real pixel. */
			/* A video smaller than the screen (the PEGI rating). */
			#overlay .cutscene.framed {
				top: 50%;
				width: auto;
				height: calc(var(--px) * 200);
				max-width: calc(100% - var(--px) * 20);
				transform: translate(-50%, -50%);
				object-fit: contain;
			}

			#hints, #hints-top {
				position: absolute;
				right: calc(var(--hp) * 6 + var(--clip-right, 0px));
				bottom: calc(var(--hp) * 5 + var(--clip-bottom, 0px));
				display: flex;
				gap: calc(var(--hp) * 8);
				font: calc(var(--hp) * 8) / 1 "NES", "Courier New", monospace;
				color: white;
				/* 1-pixel black outline around everything, NES sprite style. */
				filter:
					drop-shadow(var(--hp) 0 0 black)
					drop-shadow(calc(var(--hp) * -1) 0 0 black)
					drop-shadow(0 var(--hp) 0 black)
					drop-shadow(0 calc(var(--hp) * -1) 0 black);
			}

			/* Text card (boss briefing). Positioned from JS on whole pixels. */
			.briefing-page {
				position: absolute;
				font: calc(var(--hp) * 8) / calc(var(--hp) * 9) "NES", monospace;
				text-align: center;
				/* The NES font's lowercase letters are unreadable. */
				text-transform: uppercase;
			}
			.briefing-page p {
				margin: 0 0 calc(var(--hp) * 9);
			}
			.briefing-page p:last-child {
				margin-bottom: 0;
			}
			/* Lines with control icons need room for them. */
			.briefing-page p.has-glyph {
				line-height: calc(var(--hp) * 14);
			}
			.briefing-page .key, .briefing-page .pad-face, .briefing-page .pad-pill,
			.briefing-page .pad-dpad, .briefing-page .mouse {
				vertical-align: middle;
				margin: 0 var(--hp);
			}
			.mouse {
				display: inline-flex;
				color: white;
			}

			/* Down arm of the d-pad lit up, for "hold down". */
			.pad-dpad-down b {
				position: absolute;
				left: calc(var(--hp) * 4);
				width: calc(var(--hp) * 4);
				top: calc(var(--hp) * 8);
				height: calc(var(--hp) * 4);
				background: #fcfcfc;
			}

			.hint-plus {
				margin: 0 calc(var(--hp) * -1);
			}

			/* Online lobby form, on the right of the screen. */
			.online-panel {
				position: absolute;
				top: calc(var(--px) * 12);
				right: calc(var(--px) * 12 + var(--clip-right, 0px));
				width: calc(var(--hp) * 250);
				max-width: calc(100% - var(--px) * 160 - var(--clip-right, 0px) - var(--clip-left, 0px));
				max-height: calc(100% - var(--px) * 24);
				overflow-y: auto;
				box-sizing: border-box;
				padding: calc(var(--hp) * 8);
				background: #000;
				border: calc(var(--hp) * 2) solid #fcfcfc;
				border-radius: calc(var(--hp) * 2);
				color: #fcfcfc;
				font: calc(var(--hp) * 8) / 1.4 "NES", monospace;
				pointer-events: auto;
			}
			.online-panel label { display: block; margin: calc(var(--hp) * 6) 0 calc(var(--hp) * 3); color: #bcbcbc; }
			.online-panel .row { display: flex; gap: calc(var(--hp) * 4); align-items: center; margin: calc(var(--hp) * 3) 0; flex-wrap: wrap; }
			.online-panel input {
				font: inherit; color: #fcfcfc; background: #202020; text-transform: uppercase;
				border: calc(var(--hp) * 1) solid #7c7c7c; padding: calc(var(--hp) * 2) calc(var(--hp) * 4);
				width: calc(var(--hp) * 120); outline: none;
			}
			.online-panel input:focus { border-color: #fcfcfc; }
			.online-panel button {
				font: inherit; color: #fcfcfc; background: #303030; cursor: pointer;
				border: calc(var(--hp) * 1) solid #7c7c7c; padding: calc(var(--hp) * 2) calc(var(--hp) * 5);
			}
			.online-panel button:hover:not(:disabled), .online-panel button.on { border-color: #fcfcfc; background: #4c4c4c; }
			.online-panel button.on { color: #f8b800; }
			.online-panel button:disabled { color: #5c5c5c; cursor: default; }
			.online-panel button.big { color: #f8b800; }
			.online-panel .swatch { width: calc(var(--hp) * 14); height: calc(var(--hp) * 14); padding: 0; }
			.online-panel .swatch.on { outline: calc(var(--hp) * 1) solid #fcfcfc; outline-offset: calc(var(--hp) * 1); }
			.online-panel .code { color: #f8b800; letter-spacing: calc(var(--hp) * 2); }
			.online-panel .players { list-style: none; padding: 0; margin: calc(var(--hp) * 4) 0; }
			.online-panel .players span { color: #7c7c7c; }
			.online-panel .stage { min-width: calc(var(--hp) * 120); text-align: center; }
			.online-panel .message { color: #f8b800; margin: calc(var(--hp) * 6) 0 0; word-break: break-all; }
			.online-panel h3 { font: inherit; margin: 0 0 calc(var(--hp) * 4); color: #fcfcfc; }
			.online-panel .dim { color: #7c7c7c; }
			.online-panel .thumb { display: block; width: calc(var(--hp) * 128); height: calc(var(--hp) * 72); image-rendering: pixelated; }
			.online-panel .stage-pick { flex-wrap: nowrap; }
			.online-panel .stage-card { display: flex; flex-direction: column; align-items: center; gap: calc(var(--hp) * 2); }
			.online-panel .votes { flex-direction: column; flex-wrap: nowrap; align-items: stretch; }
			.online-panel .vote-card { display: flex; align-items: center; gap: calc(var(--hp) * 6); padding: calc(var(--hp) * 3); text-align: left; }
			.online-panel .vote-info { display: flex; flex-direction: column; gap: calc(var(--hp) * 2); }
			.online-panel .vote-card .thumb { width: calc(var(--hp) * 64); height: calc(var(--hp) * 36); }
			.online-panel .vote-card.focus { border-color: #fcfcfc; }
			.online-panel .voters { display: flex; gap: calc(var(--hp) * 2); min-height: calc(var(--hp) * 6); }
			.online-panel .voters i { width: calc(var(--hp) * 6); height: calc(var(--hp) * 6); display: block; }

			.online-panel .size { color: #7c7c7c; }
			.online-panel .size.fits { color: #f8b800; }
			.online-panel .help-label { margin-top: calc(var(--hp) * 14); }

			/* "First time online?" help: one window at a time, over the lobby. */
			.online-panel.online-help {
				top: 50%;
				right: auto;
				left: calc(var(--clip-left, 0px) + (100% - var(--clip-left, 0px) - var(--clip-right, 0px)) / 2);
				transform: translate(-50%, -50%);
				width: calc(var(--hp) * 300);
				max-width: calc(100% - var(--px) * 24 - var(--clip-left, 0px) - var(--clip-right, 0px));
				padding: calc(var(--hp) * 12);
				z-index: 2;
			}
			.online-help h3 { color: #f8b800; margin-bottom: calc(var(--hp) * 8); }
			.online-help p { margin: 0 0 calc(var(--hp) * 6); line-height: 1.6; }
			.online-help .help-nav { justify-content: space-between; margin-top: calc(var(--hp) * 10); }

			/* Hints that shouldn't clutter the bottom (e.g. pause). */
			#hints-top {
				bottom: auto;
				top: calc(var(--hp) * 5);
			}

			.hint {
				display: flex;
				align-items: center;
				gap: calc(var(--hp) * 2);
			}

			.hint-label {
				margin-left: var(--hp);
			}

			.key, .pad-face, .pad-pill {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				gap: var(--hp);
				box-sizing: border-box;
				height: calc(var(--hp) * 12);
				min-width: calc(var(--hp) * 12);
				font-size: calc(var(--hp) * 8);
			}

			/* Keycap: flat face, darker bottom row, corners notched by a pixel. */
			.key {
				padding: 0 calc(var(--hp) * 2) var(--hp);
				background: #fcfcfc;
				color: #000;
				box-shadow: inset 0 calc(var(--hp) * -2) 0 #a4a4a4;
				clip-path: polygon(
					var(--hp) 0, calc(100% - var(--hp)) 0,
					calc(100% - var(--hp)) var(--hp), 100% var(--hp),
					100% calc(100% - var(--hp)), calc(100% - var(--hp)) calc(100% - var(--hp)),
					calc(100% - var(--hp)) 100%, var(--hp) 100%,
					var(--hp) calc(100% - var(--hp)), 0 calc(100% - var(--hp)),
					0 var(--hp), var(--hp) var(--hp));
			}

			.key-arrow {
				width: calc(var(--hp) * 7);
				height: calc(var(--hp) * 7);
			}

			/* Face buttons: a 12x12 pixel circle. */
			.pad-face {
				width: calc(var(--hp) * 12);
				padding-left: var(--hp);
				color: white;
				box-shadow: inset 0 calc(var(--hp) * -2) 0 rgba(0, 0, 0, 0.35);
				clip-path: polygon(
					calc(var(--hp) * 4) 0, calc(var(--hp) * 8) 0,
					calc(var(--hp) * 8) var(--hp), calc(var(--hp) * 10) var(--hp),
					calc(var(--hp) * 10) calc(var(--hp) * 2), calc(var(--hp) * 11) calc(var(--hp) * 2),
					calc(var(--hp) * 11) calc(var(--hp) * 4), calc(var(--hp) * 12) calc(var(--hp) * 4),
					calc(var(--hp) * 12) calc(var(--hp) * 8), calc(var(--hp) * 11) calc(var(--hp) * 8),
					calc(var(--hp) * 11) calc(var(--hp) * 10), calc(var(--hp) * 10) calc(var(--hp) * 10),
					calc(var(--hp) * 10) calc(var(--hp) * 11), calc(var(--hp) * 8) calc(var(--hp) * 11),
					calc(var(--hp) * 8) calc(var(--hp) * 12), calc(var(--hp) * 4) calc(var(--hp) * 12),
					calc(var(--hp) * 4) calc(var(--hp) * 11), calc(var(--hp) * 2) calc(var(--hp) * 11),
					calc(var(--hp) * 2) calc(var(--hp) * 10), var(--hp) calc(var(--hp) * 10),
					var(--hp) calc(var(--hp) * 8), 0 calc(var(--hp) * 8),
					0 calc(var(--hp) * 4), var(--hp) calc(var(--hp) * 4),
					var(--hp) calc(var(--hp) * 2), calc(var(--hp) * 2) calc(var(--hp) * 2),
					calc(var(--hp) * 2) var(--hp), calc(var(--hp) * 4) var(--hp));
			}
			.pad-A { background: #38b818; }
			.pad-B { background: #d82800; }
			.pad-X { background: #0058f8; }
			.pad-Y { background: #f8b800; }

			/* Bumpers: dark pill with stepped 2-pixel corners. */
			.pad-pill {
				padding: 0 calc(var(--hp) * 3) var(--hp);
				background: #484848;
				color: white;
				box-shadow: inset 0 calc(var(--hp) * -2) 0 #282828;
				clip-path: polygon(
					calc(var(--hp) * 2) 0, calc(100% - var(--hp) * 2) 0,
					calc(100% - var(--hp) * 2) var(--hp), calc(100% - var(--hp)) var(--hp),
					calc(100% - var(--hp)) calc(var(--hp) * 2), 100% calc(var(--hp) * 2),
					100% calc(100% - var(--hp) * 2), calc(100% - var(--hp)) calc(100% - var(--hp) * 2),
					calc(100% - var(--hp)) calc(100% - var(--hp)), calc(100% - var(--hp) * 2) calc(100% - var(--hp)),
					calc(100% - var(--hp) * 2) 100%, calc(var(--hp) * 2) 100%,
					calc(var(--hp) * 2) calc(100% - var(--hp)), var(--hp) calc(100% - var(--hp)),
					var(--hp) calc(100% - var(--hp) * 2), 0 calc(100% - var(--hp) * 2),
					0 calc(var(--hp) * 2), var(--hp) calc(var(--hp) * 2),
					var(--hp) var(--hp), calc(var(--hp) * 2) var(--hp));
			}

			/* Xbox d-pad: a 12x12 pixel cross. */
			.pad-dpad {
				position: relative;
				display: inline-block;
				width: calc(var(--hp) * 12);
				height: calc(var(--hp) * 12);
			}
			.pad-dpad i {
				position: absolute;
				background: #484848;
			}
			.pad-dpad i:first-of-type {
				left: 0; right: 0;
				top: calc(var(--hp) * 4); height: calc(var(--hp) * 4);
			}
			.pad-dpad i:last-of-type {
				top: 0; bottom: 0;
				left: calc(var(--hp) * 4); width: calc(var(--hp) * 4);
				box-shadow: inset 0 calc(var(--hp) * -1) 0 #282828;
			}
		</style>

    </head>
